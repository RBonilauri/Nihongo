# .github/workflows/tests.yml
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: src/requirements.txt

      - name: Installer les dépendances
        run: pip install -r src/requirements.txt

      - name: Installer Chromium pour Playwright
        run: python -m playwright install --with-deps chromium

      - name: Build + tests (make test)
        run: make test

      - name: index.html est à jour avec les sources
        run: |
          git diff --exit-code --stat index.html || {
            echo "::error file=index.html::index.html ne correspond pas aux sources. Lance 'make build' et committe le résultat."
            exit 1
          }
